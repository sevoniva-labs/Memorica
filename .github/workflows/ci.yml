name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Backend ---
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: cd backend && ./gradlew check --no-daemon -x test

  backend-test:
    needs: backend-lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memorica_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: cd backend && ./gradlew test --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/memorica_test
          DB_USERNAME: test
          DB_PASSWORD: test
          JWT_SECRET: test-jwt-secret-for-ci-do-not-use-in-production
          JWT_ACCESS_EXPIRATION: "900000"
          JWT_REFRESH_EXPIRATION: "604800000"
          JPA_DDL_AUTO: validate

  # --- Frontend ---
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --frozen-lockfile
      - run: cd frontend && npm run lint

  frontend-build:
    needs: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --frozen-lockfile
      - run: cd frontend && npm run build

  # --- Hocuspocus ---
  hocuspocus-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: hocuspocus/package-lock.json
      - run: cd hocuspocus && npm ci --frozen-lockfile
      - run: cd hocuspocus && node -c src/server.js && node -c src/db.js

  # --- Docker Build (main only) ---
  docker-build:
    if: github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build, hocuspocus-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml build
