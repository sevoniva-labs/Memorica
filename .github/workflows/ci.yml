name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6
      - run: cd backend && ./gradlew check --no-daemon

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
      - run: cd frontend && npm audit --omit=dev --audit-level=high

  hocuspocus-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: hocuspocus/package-lock.json
      - run: cd hocuspocus && npm ci
      - run: cd hocuspocus && node -c src/server.js && node -c src/db.js
      - run: cd hocuspocus && npm audit --omit=dev --audit-level=high

  compose-check:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-db-password
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      CORS_ALLOWED_ORIGINS: https://memorica.example.com
      DOMAIN_NAME: memorica.example.com
      MINIO_IMAGE_TAG: latest
      TLS_CERT_PATH: /tmp/memorica-ci-fullchain.pem
      TLS_KEY_PATH: /tmp/memorica-ci-privkey.pem
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml config -q
      - run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml config -q

  docker-build:
    if: github.ref == 'refs/heads/main'
    needs: [backend-check, frontend-check, hocuspocus-check, compose-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/docker-compose.yml build
