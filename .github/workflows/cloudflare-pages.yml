name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/pre-release-hardening
    paths:
      - .github/workflows/cloudflare-pages.yml
      - frontend/**
      - scripts/cloudflare-pages-*.mjs
      - scripts/cloudflare-demo-smoke*.mjs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'memorica-frontend' }}
      CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH || github.ref_name }}
      CLOUDFLARE_PAGES_URL: ${{ vars.CLOUDFLARE_PAGES_URL || 'https://memorica-frontend-5ut.pages.dev' }}
      MEMORICA_DEMO_USERNAME: ${{ vars.MEMORICA_DEMO_USERNAME || 'demo' }}
      MEMORICA_DEMO_PASSWORD: ${{ secrets.MEMORICA_DEMO_PASSWORD || 'Memorica2026' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_URL: ${{ vars.VITE_WS_URL }}
      VITE_DRAWIO_URL: ${{ vars.VITE_DRAWIO_URL || 'https://embed.diagrams.net/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID repository variable is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN repository secret is missing"; exit 1; }

      - name: Preflight Cloudflare Pages config
        run: node scripts/cloudflare-pages-preflight.mjs --skip-dist

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmmirror.com
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages
        run: |
          npm_config_registry=https://registry.npmmirror.com npx --yes wrangler@4.100.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$CLOUDFLARE_PAGES_BRANCH"
        working-directory: frontend

      - name: Smoke test Cloudflare demo
        run: node scripts/cloudflare-demo-smoke.mjs
