version: "3.9"

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memorica
      POSTGRES_USER: memorica
      POSTGRES_PASSWORD: memorica-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorica"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Application Services ---
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/memorica
      DB_USERNAME: memorica
      DB_PASSWORD: memorica-dev
      JWT_SECRET: dev-jwt-secret-do-not-use-in-production-change-me
      JWT_ACCESS_EXPIRATION: "900000"
      JWT_REFRESH_EXPIRATION: "604800000"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: memorica
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JPA_DDL_AUTO: validate
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  hocuspocus:
    build:
      context: ../hocuspocus
      dockerfile: Dockerfile
    environment:
      PORT: "1234"
      DATABASE_URL: postgresql://memorica:memorica-dev@postgres:5432/memorica
      JWT_SECRET: dev-jwt-secret-do-not-use-in-production-change-me
      REDIS_URL: redis://redis:6379
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - hocuspocus

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - hocuspocus

volumes:
  postgres-data:
  minio-data:
