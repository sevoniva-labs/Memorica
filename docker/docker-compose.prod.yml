# Production deployment overrides.
# Run with:
#   DB_PASSWORD=... JWT_SECRET=... MINIO_ACCESS_KEY=... MINIO_SECRET_KEY=... \
#   REDIS_PASSWORD=... CORS_ALLOWED_ORIGINS=https://memorica.example.com \
#   CORS_ALLOWED_ORIGIN_PATTERNS=https://*.pages.dev MINIO_IMAGE_TAG=RELEASE.2026-01-01T00-00-00Z \
#   TLS_CERT_PATH=/etc/letsencrypt/live/memorica.example.com/fullchain.pem \
#   TLS_KEY_PATH=/etc/letsencrypt/live/memorica.example.com/privkey.pem \
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    restart: always
    environment:
      POSTGRES_DB: memorica
      POSTGRES_USER: memorica
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:?MINIO_IMAGE_TAG is required}
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      replicas: 2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/memorica
      DB_USERNAME: memorica
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}

  hocuspocus-1:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
      replicas: 2
    environment:
      DATABASE_URL: postgresql://memorica:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/memorica
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379

  drawio:
    restart: always

  frontend:
    restart: always
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_DRAWIO_URL: ${VITE_DRAWIO_URL:-https://embed.diagrams.net/}

  nginx:
    image: nginx:${NGINX_IMAGE_TAG:-1.27-alpine}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/certs/privkey.pem:ro
