version: "3.9"

# Production deployment overrides.
# Run with:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      replicas: 2
    environment:
      SPRING_PROFILES_ACTIVE: prod

  hocuspocus-1:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
      replicas: 2

  frontend:
    restart: always

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
