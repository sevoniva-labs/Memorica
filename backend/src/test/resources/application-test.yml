spring:
  datasource:
    url: jdbc:h2:mem:memorica_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  jwt:
    secret: test-jwt-secret-at-least-256-bits-for-hmac-sha256-testing
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  minio:
    endpoint: http://localhost:9000
    access-key: test
    secret-key: testtest
    bucket-name: test-bucket
  file:
    max-size: 10485760
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  allowed-origin-patterns: https://*.pages.dev
