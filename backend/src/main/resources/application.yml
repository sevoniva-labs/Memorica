server:
  port: 8080

spring:
  application:
    name: collab-doc-api
  datasource:
    url: jdbc:postgresql://localhost:5432/collab
    username: collab
    password: collab123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: collab-doc-jwt-secret-key-2026-very-long-and-secure
    expiration-ms: 86400000  # 24 hours
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: collab-doc
  hocuspocus:
    webhook-secret: hocuspocus-webhook-secret

cors:
  allowed-origins: "*"
