// ── Flyway ────────────────────────────────────────────────────────────────────
flyway {
    url = System.getenv('DB_URL') ?: 'jdbc:postgresql://localhost:5432/collab'
    user = System.getenv('DB_USERNAME') ?: 'collab'
    password = System.getenv('DB_PASSWORD') ?: 'collab123'
    cleanDisabled = true
}
