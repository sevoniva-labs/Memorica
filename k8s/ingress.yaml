apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memorica
  namespace: memorica
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - memorica.example.com
      secretName: memorica-tls
  rules:
    - host: memorica.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: memorica-api
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: memorica-hocuspocus
                port:
                  number: 1234
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memorica-frontend
                port:
                  number: 80
