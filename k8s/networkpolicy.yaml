apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memorica-default-deny
  namespace: memorica
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memorica-app-traffic
  namespace: memorica
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - memorica-api
          - memorica-hocuspocus
          - memorica-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 1234
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
