apiVersion: v1
kind: ConfigMap
metadata:
  name: memorica-config
  namespace: memorica
data:
  DB_URL: "jdbc:postgresql://postgres:5432/memorica"
  SPRING_PROFILES_ACTIVE: "prod"
  CORS_ALLOWED_ORIGINS: "https://memorica.example.com"
  JPA_DDL_AUTO: "validate"
---
apiVersion: v1
kind: Secret
metadata:
  name: memorica-secrets
  namespace: memorica
type: Opaque
stringData:
  DB_USERNAME: "memorica"
  DB_PASSWORD: "change-me-in-production"
  JWT_SECRET: "change-me-use-openssl-rand-base64-64"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  REDIS_PASSWORD: ""
