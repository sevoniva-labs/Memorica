apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorica-api
  namespace: memorica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorica-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorica-hocuspocus
  namespace: memorica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorica-hocuspocus
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
