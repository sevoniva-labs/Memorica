apiVersion: v1
kind: Secret
metadata:
  name: memorica-secrets
  namespace: memorica
type: Opaque
stringData:
  DB_USERNAME: "memorica"
  DB_PASSWORD: "replace-with-a-strong-database-password"
  JWT_SECRET: "replace-with-output-of-openssl-rand-base64-64"
  MINIO_ACCESS_KEY: "replace-with-s3-access-key"
  MINIO_SECRET_KEY: "replace-with-s3-secret-key"
  REDIS_PASSWORD: "replace-with-a-strong-redis-password"
